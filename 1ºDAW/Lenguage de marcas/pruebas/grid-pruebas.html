<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            border: 2px black solid;
        }
        #main {
            display: grid;
            width: 1000px;
            height: 600px;
            grid-template-columns: 25% 25% 25%;
            grid-template-rows: 25% 25% 25%;
            background-color: rgb(192, 158, 255);
            justify-content: center;
            align-content: center;
            justify-items: center;
            align-items: center;
            grid-gap: 5px 5px;  
        }

        #main div {
            display: grid;
            width: 100%;
            height: 100%;
            background-color: steelblue;
            align-items: center;
            justify-items: center;
        }
    </style>
</head>
<body>
    <div id="main">
        <div style="grid-area: 1/1/3/3;">1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
