<!DOCTYPE html>
<!-- aitor garfias guasch ejercicio 4 -->
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
    <style>
        body {
            position: relative;
            margin: 0px;
            min-height: 100vh;
            width: 100vw;
            background:silver ;
        }

        div {
            position: relative;
            width: 30%;
            height: 100px;
            border: 3px solid black;
            background-color: silver;
            font-size: 75px;
            text-align: center;
            margin: 5px;
            padding: 5px;
            box-sizing: border-box;
        }

        #padre {
            position: absolute;
            margin: auto;
            background-color: orange;
            border: 3px solid black;
            width: 95%;
            height: 95%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }

        #d1 {
            position: absolute;
            margin: auto;
            background-color: violet;
            border: 3px solid black;
            width: 70%;
            height: 70%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            
        }

        #d2 {
            position: absolute;
            margin: auto;
            background-color: green;
            border: 3px solid black;
            width: 45%;
            height: 45%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            
        }

        #d3 {
            position: absolute;
            margin: auto;
            background-color: blue;
            border: 3px solid black;
            width: 20%;
            height: 20%;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;

        }

        #d4 {
            position: absolute;
            margin: auto;
            background-color: red;
            border: 3px solid black;
            width: 100px;
            height: 100px;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;

        }

    </style>
</head>
<body>
    <div id="padre">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
</body>
</html>
