<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        *{
            background-color: black;
        }
       #div-principal{
        position: relative;
       }
       #div-1{
        position: absolute;
        left: 25%;
        width: 74%;
        background-color: red;
        color:blue;
        margin: 10px;
        height: 95vh;
       }
       #div-2{
        position: absolute;
        right: 75%;
        width: 20%;
        background-color: blue;
        color:red;
        margin: 10px;
        margin-left: 100px;
        height: 95vh;
        width: 24%;
       }
       
    </style>    
</head>
<body>
    <div id="div-principal">
        <div id="div-1">1</div>
        <div id="div-2">2</div>
    </div>
</body>
</html>
